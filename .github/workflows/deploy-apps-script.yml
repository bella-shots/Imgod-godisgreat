name: Deploy Phase 4 Apps Script

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Phase-4/Automation/**'
      - '.github/workflows/deploy-apps-script.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install clasp
        run: npm install --global @google/clasp

      - name: Configure clasp credentials
        env:
          CLASPRC: ${{ secrets.CLASP_CREDENTIALS }}
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          test -n "$CLASPRC" || { echo "Missing CLASPRC"; exit 1; }
          test -n "$APPS_SCRIPT_ID" || { echo "Missing APPS_SCRIPT_ID"; exit 1; }
          printf '%s' "$CLASPRC" > "$HOME/.clasprc.json"
          test "$APPS_SCRIPT_ID" = "1GGhlK-ZbXtNlG8WtSAMewIoymQ6hYeuwcf4YpvNwneYK8xUiv7LIz05W" || {
            echo "FAIL: APPS_SCRIPT_ID secret does not target the approved MASTER COMPANY Apps Script project."
            exit 1
          }
          echo "TARGET APPS SCRIPT ID: $APPS_SCRIPT_ID"

      - name: Verify local clasp project configuration
        working-directory: Phase-4/Automation
        run: |
          test -f .clasp.json || { echo "FAIL: Phase-4/Automation/.clasp.json missing"; exit 1; }
          grep -q '"scriptId": "1GGhlK-ZbXtNlG8WtSAMewIoymQ6hYeuwcf4YpvNwneYK8xUiv7LIz05W"' .clasp.json || { echo "FAIL: wrong scriptId in .clasp.json"; exit 1; }
          grep -q '"rootDir": "."' .clasp.json || { echo "FAIL: rootDir must be ."; exit 1; }
          test -f employee_creation_workflow.gs || { echo "FAIL: direct employee workflow is not at Apps Script project root"; exit 1; }
          grep -q "function setupEmployeeDirectSheetWorkflow" employee_creation_workflow.gs || { echo "FAIL: local direct setup function missing"; exit 1; }

      - name: Push GitHub source to existing Apps Script project
        working-directory: Phase-4/Automation
        run: |
          clasp push --force --non-interactive
          echo "=== CLASP STATUS AFTER PUSH ==="
          clasp status --json

      - name: Pull the actual live Apps Script project
        run: |
          rm -rf /tmp/live-apps-script
          mkdir -p /tmp/live-apps-script
          cp Phase-4/Automation/.clasp.json /tmp/live-apps-script/.clasp.json
          cp "$HOME/.clasprc.json" /tmp/live-apps-script/.clasprc.json
          cd /tmp/live-apps-script
          clasp pull --force
          echo "=== LIVE FILES RETURNED BY GOOGLE ==="
          find . -maxdepth 2 -type f -print | sort

      - name: Verify actual live source
        run: |
          FILE="/tmp/live-apps-script/employee_creation_workflow.gs"
          test -f "$FILE" || {
            echo "FAIL: Google Apps Script API did not return employee_creation_workflow.gs from the target project."
            echo "=== LIVE DIRECTORY ==="
            find /tmp/live-apps-script -maxdepth 3 -type f -print | sort
            exit 1
          }
          grep -q "function setupEmployeeDirectSheetWorkflow" "$FILE" || { echo "FAIL: setupEmployeeDirectSheetWorkflow missing from live source"; exit 1; }
          grep -q "function processEmployeeSheetControl" "$FILE" || { echo "FAIL: processEmployeeSheetControl missing from live source"; exit 1; }
          if grep -q "function onOpen" "$FILE"; then echo "FAIL: obsolete onOpen remains in live source"; exit 1; fi
          if grep -q "function showEmployeeCreationSidebar" "$FILE"; then echo "FAIL: obsolete sidebar function remains in live source"; exit 1; fi
          if grep -q "function generatePendingEmployeeId" "$FILE"; then echo "FAIL: obsolete generatePendingEmployeeId remains in live source"; exit 1; fi
          if grep -q "function saveEmployee(" "$FILE"; then echo "FAIL: obsolete saveEmployee remains in live source"; exit 1; fi
          echo "PASS: live MASTER COMPANY Apps Script contains the direct Employees-sheet workflow and no obsolete employee-sidebar workflow.";
