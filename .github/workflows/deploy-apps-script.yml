name: Deploy Phase 4 Apps Script

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Phase-4/Automation/**'
      - '.github/workflows/deploy-apps-script.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install clasp
        run: npm install --global @google/clasp

      - name: Configure clasp
        env:
          CLASPRC: ${{ secrets.CLASP_CREDENTIALS }}
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          test -n "$CLASPRC"
          test "$APPS_SCRIPT_ID" = "1GGhlK-ZbXtNlG8WtSAMewIoymQ6hYeuwcf4YpvNwneYK8xUiv7LIz05W"
          printf '%s' "$CLASPRC" > "$HOME/.clasprc.json"

      - name: Prepare exact Apps Script source
        run: |
          rm -rf "$RUNNER_TEMP/apps-script"
          mkdir -p "$RUNNER_TEMP/apps-script"
          cp Phase-4/Automation/.clasp.json "$RUNNER_TEMP/apps-script/.clasp.json"
          find Phase-4/Automation/Core Phase-4/Automation/Drive-Placement Phase-4/Automation/Verification -type f -name '*.gs' -exec cp {} "$RUNNER_TEMP/apps-script/" \;
          find Phase-4/Automation/Core Phase-4/Automation/Drive-Placement Phase-4/Automation/Verification -type f -name '*.html' -exec cp {} "$RUNNER_TEMP/apps-script/" \;
          test -f "$RUNNER_TEMP/apps-script/employee_creation_workflow.gs"
          grep -q "function setupEmployeeDirectSheetWorkflow" "$RUNNER_TEMP/apps-script/employee_creation_workflow.gs"

      - name: Push to existing MASTER COMPANY Apps Script
        run: |
          cd "$RUNNER_TEMP/apps-script"
          clasp push --force --non-interactive
          echo "=== CLASP STATUS ==="
          clasp status --json

      - name: Pull live Apps Script source
        run: |
          rm -rf "$RUNNER_TEMP/apps-script-live"
          mkdir -p "$RUNNER_TEMP/apps-script-live"
          cp "$RUNNER_TEMP/apps-script/.clasp.json" "$RUNNER_TEMP/apps-script-live/.clasp.json"
          cd "$RUNNER_TEMP/apps-script-live"
          clasp pull --force
          echo "=== LIVE FILES RETURNED BY GOOGLE ==="
          find . -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Verify live Apps Script by content, not filename
        run: |
          LIVE="$RUNNER_TEMP/apps-script-live"
          echo "=== SEARCHING LIVE SOURCE FOR DIRECT WORKFLOW ==="
          NEW_MATCHES=$(grep -RIl "function setupEmployeeDirectSheetWorkflow" "$LIVE" --include='*.gs' || true)
          echo "$NEW_MATCHES"
          test -n "$NEW_MATCHES" || {
            echo "FAIL: Google Apps Script live source does not contain setupEmployeeDirectSheetWorkflow."
            echo "=== ALL LIVE SOURCE FILES ==="
            find "$LIVE" -type f -print | sort
            exit 1
          }

          NEW_FILE=$(printf '%s\n' "$NEW_MATCHES" | head -n 1)
          grep -q "function processEmployeeSheetControl" "$NEW_FILE" || { echo "FAIL: processEmployeeSheetControl missing"; exit 1; }

          echo "=== SEARCHING FOR OBSOLETE WORKFLOW ==="
          OBSOLETE=$(grep -RIlE "function (onOpen|showEmployeeCreationSidebar|generatePendingEmployeeId|saveEmployee\()" "$LIVE" --include='*.gs' --include='*.html' || true)
          if [ -n "$OBSOLETE" ]; then
            echo "FAIL: obsolete employee workflow still exists in live Apps Script:"
            echo "$OBSOLETE"
            echo "=== OBSOLETE MATCHES ==="
            grep -RInE "function (onOpen|showEmployeeCreationSidebar|generatePendingEmployeeId|saveEmployee\()" "$LIVE" --include='*.gs' --include='*.html' || true
            exit 1
          fi

          echo "PASS: live MASTER COMPANY Apps Script contains the direct Employees-sheet workflow and no obsolete employee workflow."
