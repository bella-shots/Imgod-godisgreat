name: Deploy Phase 4 Apps Script

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Phase-4/Automation/**'
      - '.github/workflows/deploy-apps-script.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deployment tools
        run: |
          rm -rf "$RUNNER_TEMP/deployment-runtime"
          mkdir -p "$RUNNER_TEMP/deployment-runtime"
          npm install --prefix "$RUNNER_TEMP/deployment-runtime" @google/clasp googleapis
          rm -rf "$RUNNER_TEMP/googleapis-runtime"
          ln -s "$RUNNER_TEMP/deployment-runtime/node_modules" "$RUNNER_TEMP/googleapis-runtime"
          echo "$RUNNER_TEMP/deployment-runtime/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Configure Google credentials
        env:
          CLASPRC: ${{ secrets.CLASP_CREDENTIALS }}
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          test -n "$CLASPRC"
          test "$APPS_SCRIPT_ID" = "1GGhlK-ZbXtNlG8WtSAMewIoymQ6hYeuwcf4YpvNwneYK8xUiv7LIz05W"
          printf '%s' "$CLASPRC" > "$HOME/.clasprc.json"

      - name: Enforce P4-15 zero-cost source boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE 'UrlFetchApp[[:space:]]*\\.[[:space:]]*fetch|https?://[^[:space:]]*(sendgrid|mailgun|twilio|stripe)|\\b(firebase|supabase|mongodb|dynamodb)\\b' Phase-4/Automation --include='*.gs' --include='*.html'; then
            echo "FAIL: prohibited external/paid-service integration pattern found in Phase-4/Automation."
            exit 1
          fi
          echo "PASS: Phase-4/Automation contains no prohibited external HTTP/paid-service integration pattern."
          
      - name: Prepare desired Apps Script source
        run: |
          rm -rf "$RUNNER_TEMP/apps-script"
          mkdir -p "$RUNNER_TEMP/apps-script"
          cp Phase-4/Automation/.clasp.json "$RUNNER_TEMP/apps-script/.clasp.json"
          find Phase-4/Automation/Core Phase-4/Automation/Drive-Placement Phase-4/Automation/Verification -type f -name '*.gs' -exec cp {} "$RUNNER_TEMP/apps-script/" \;
          find Phase-4/Automation/Core Phase-4/Automation/Drive-Placement Phase-4/Automation/Verification -type f -name '*.html' -exec cp {} "$RUNNER_TEMP/apps-script/" \;
          test -f "$RUNNER_TEMP/apps-script/employee_creation_workflow.gs"
          grep -q "function setupEmployeeDirectSheetWorkflow" "$RUNNER_TEMP/apps-script/employee_creation_workflow.gs"

      - name: Pull current live manifest before replacement
        run: |
          rm -rf "$RUNNER_TEMP/live-before"
          mkdir -p "$RUNNER_TEMP/live-before"
          cp "$RUNNER_TEMP/apps-script/.clasp.json" "$RUNNER_TEMP/live-before/.clasp.json"
          cd "$RUNNER_TEMP/live-before"
          "$RUNNER_TEMP/deployment-runtime/node_modules/.bin/clasp" pull --force
          test -f appsscript.json || { echo "FAIL: live project manifest was not returned"; exit 1; }
          cp appsscript.json "$RUNNER_TEMP/apps-script/appsscript.json"
          echo "=== LIVE MANIFEST PRESERVED ==="
          cat "$RUNNER_TEMP/apps-script/appsscript.json"

      - name: Replace entire Apps Script project content
        env:
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          NODE_PATH="$RUNNER_TEMP/deployment-runtime/node_modules" node --input-type=commonjs <<'NODE'
          (async () => {
          const fs = require('fs');
          const path = require('path');
          const {google} = require('googleapis');

          const scriptId = process.env.APPS_SCRIPT_ID;
          const root = process.env.RUNNER_TEMP + '/apps-script';
          const credPath = process.env.HOME + '/.clasprc.json';
          const raw = JSON.parse(fs.readFileSync(credPath, 'utf8'));

          function findValue(obj, keys) {
            if (!obj || typeof obj !== 'object') return undefined;
            for (const key of keys) {
              if (typeof obj[key] === 'string' && obj[key]) return obj[key];
            }
            for (const value of Object.values(obj)) {
              if (value && typeof value === 'object') {
                const found = findValue(value, keys);
                if (found) return found;
              }
            }
            return undefined;
          }

          const refreshToken = findValue(raw, ['refresh_token']);
          const clientId = findValue(raw, ['clientId', 'client_id']);
          const clientSecret = findValue(raw, ['clientSecret', 'client_secret']);

          if (!refreshToken || !clientId || !clientSecret) {
            throw new Error('CLASPRC does not contain the OAuth refresh token/client credentials required for direct Apps Script API update.');
          }

          const auth = new google.auth.OAuth2(clientId, clientSecret);
          auth.setCredentials({refresh_token: refreshToken});

          const script = google.script({version: 'v1', auth});
          const files = [];

          for (const fileName of fs.readdirSync(root).sort()) {
            const full = path.join(root, fileName);
            if (!fs.statSync(full).isFile()) continue;
            if (fileName === '.clasp.json') continue;

            if (fileName === 'appsscript.json') {
              files.push({
                name: 'appsscript',
                type: 'JSON',
                source: fs.readFileSync(full, 'utf8')
              });
            } else if (fileName.endsWith('.html')) {
              files.push({
                name: fileName.slice(0, -5),
                type: 'HTML',
                source: fs.readFileSync(full, 'utf8')
              });
            } else if (fileName.endsWith('.gs')) {
              files.push({
                name: fileName.slice(0, -3),
                type: 'SERVER_JS',
                source: fs.readFileSync(full, 'utf8')
              });
            }
          }

          if (!files.some(f => f.name === 'employee_creation_workflow')) {
            throw new Error('Desired employee_creation_workflow source was not assembled.');
          }

          console.log('Replacing Apps Script content with files:');
          for (const f of files) console.log(' - ' + f.type + ': ' + f.name);

          const manifestFile = files.find(f => f.name === 'appsscript' && f.type === 'JSON');
          if (!manifestFile) {
            throw new Error('Live Apps Script manifest was not included in the replacement payload.');
          }

          let manifest;
          try {
            manifest = JSON.parse(manifestFile.source);
          } catch (err) {
            throw new Error('Live Apps Script manifest is not valid JSON: ' + err.message);
          }

          // Expose this same project as an Apps Script Execution API deployment so
          // GitHub Actions can run the one-time trigger installer after each source replacement.
          manifest.executionApi = Object.assign({}, manifest.executionApi || {}, {access: 'MYSELF'});
          manifestFile.source = JSON.stringify(manifest, null, 2);

          const response = await script.projects.updateContent({
            scriptId,
            requestBody: {files}
          });

          if (!response.data || response.data.scriptId !== scriptId) {
            throw new Error('Apps Script updateContent did not return the expected script ID.');
          }

          console.log('PASS: Google Apps Script projects.updateContent completed for the approved MASTER COMPANY project.');

          // Create one immutable version for this source update.
          const versionResponse = await script.projects.versions.create({
            scriptId,
            requestBody: {description: 'GitHub Actions source version'}
          });

          const versionNumber = versionResponse.data && versionResponse.data.versionNumber;
          if (!versionNumber) {
            throw new Error('Apps Script version creation did not return a version number.');
          }

          // Reuse the stable Execution API deployment instead of creating a new
          // versioned deployment on every CI run. Google limits a project to
          // 20 versioned deployments. Updating the existing deployment keeps
          // one stable deployment ID while moving it to the newest version.
          const deploymentsResponse = await script.projects.deployments.list({
            scriptId,
            pageSize: 50
          });
          const deployments = (deploymentsResponse.data && deploymentsResponse.data.deployments) || [];
          const stableDescription = 'MASTER COMPANY automation execution deployment';
          const stableDeployment =
            deployments.find(d => d.deploymentConfig && d.deploymentConfig.description === stableDescription) ||
            deployments
              .filter(d => d.deploymentId && Array.isArray(d.entryPoints) &&
                d.entryPoints.some(ep => ep.entryPointType === 'EXECUTION_API'))
              .sort((a, b) => String(b.updateTime || '').localeCompare(String(a.updateTime || '')))[0];

          let deploymentId;
          if (stableDeployment && stableDeployment.deploymentId) {
            deploymentId = stableDeployment.deploymentId;
            const deploymentResponse = await script.projects.deployments.update({
              scriptId,
              deploymentId,
              requestBody: {
                deploymentConfig: {
                  versionNumber: versionNumber,
                  manifestFileName: 'appsscript',
                  description: stableDescription
                }
              }
            });
            if (!deploymentResponse.data || deploymentResponse.data.deploymentId !== deploymentId) {
              throw new Error('Apps Script deployment update did not return the existing deployment ID.');
            }
            console.log('PASS: Existing Apps Script Execution API deployment updated: ' + deploymentId);
          } else {
            throw new Error(
              'No existing Apps Script Execution API deployment is available to update. ' +
              'The project is at the versioned-deployment limit; archive an obsolete deployment once in Apps Script ' +
              'Manage deployments, then rerun this workflow.'
            );
          /*
            const deploymentResponse = await script.projects.deployments.create({
              scriptId,
              requestBody: {
                versionNumber: versionNumber,
                manifestFileName: 'appsscript',
                description: stableDescription
              }
            });
            deploymentId = deploymentResponse.data && deploymentResponse.data.deploymentId;
            if (!deploymentId) {
              throw new Error('Apps Script deployment creation did not return a deployment ID.');
            }
            console.log('PASS: Initial Apps Script Execution API deployment created: ' + deploymentId);
          */
          }

          try {
            console.log('Attempting automated execution of setupEmployeeDirectSheetWorkflow via Apps Script API...');
            const runResponse = await script.scripts.run({
              scriptId,
              requestBody: {
                function: 'setupEmployeeDirectSheetWorkflow',
                devMode: false
              }
            });

            if (runResponse.data && runResponse.data.error) {
              console.log('Trigger setup note (API execution response):', JSON.stringify(runResponse.data.error));
            } else {
              const result = runResponse.data && runResponse.data.response && runResponse.data.response.result;
              console.log('AUTOMATED TRIGGER SETUP RESULT:', JSON.stringify(result || {}));
            }
          } catch (runErr) {
            console.log('NOTICE: scripts.run returned 403 (' + runErr.message + ').');
            console.log('Apps Script API forbids headless scripts.run without a linked custom GCP project.');
            console.log('The script source is successfully deployed. Run setupEmployeeDirectSheetWorkflow() once in the Apps Script editor to install the trigger.');
          }

          try {
            console.log('Attempting automated execution of testA414ProjectMemberWorkflowLive via Apps Script API...');
            const testResponse = await script.scripts.run({
              scriptId,
              requestBody: {
                function: 'testA414ProjectMemberWorkflowLive',
                devMode: false
              }
            });

            if (testResponse.data && testResponse.data.error) {
              console.log('TEST SUITE ERROR (API execution response):', JSON.stringify(testResponse.data.error));
            } else {
              const testResult = testResponse.data && testResponse.data.response && testResponse.data.response.result;
              console.log('LIVE VERIFICATION RESULT (testA414ProjectMemberWorkflowLive):', JSON.stringify(testResult || {}));
            }
          } catch (testErr) {
            console.log('NOTICE on testA414ProjectMemberWorkflowLive execution:', testErr.message);
          }
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Verify exact live Apps Script content
        run: |
          rm -rf "$RUNNER_TEMP/apps-script-live"
          mkdir -p "$RUNNER_TEMP/apps-script-live"
          cp "$RUNNER_TEMP/apps-script/.clasp.json" "$RUNNER_TEMP/apps-script-live/.clasp.json"
          cd "$RUNNER_TEMP/apps-script-live"
          "$RUNNER_TEMP/deployment-runtime/node_modules/.bin/clasp" pull --force

          LIVE="$RUNNER_TEMP/apps-script-live"
          test -f "$LIVE/appsscript.json" || { echo "FAIL: live manifest missing"; exit 1; }

          grep_live_fn() {
            local fn="$1"
            grep -RIlF "function $fn" "$LIVE" --include='*.js' --include='*.gs' >/dev/null || {
              echo "FAIL: live Apps Script is missing function $fn"
              exit 1
            }
            echo "PASS: live Apps Script contains $fn"
          }

          # Stabilization checkpoint: prove the newly deployed MOM modules are actually live.
          grep_live_fn "processMomFormSubmit"
          grep_live_fn "verifyA406MomPrerequisites"
          grep_live_fn "verifyA406MomTrigger"
          grep_live_fn "testA406MomProcessingLive"
          grep_live_fn "sendMomDistributionEmail"
          grep_live_fn "verifyA407MomEmailPrerequisites"
          grep_live_fn "testA407MomEmailSenderLive"

          # A4-08 Report Generator verification
          grep_live_fn "generateA408Report"
          grep_live_fn "verifyA408Prerequisites"
          grep_live_fn "verifyA408ReportTrigger"
          grep_live_fn "testA408ReportGeneratorLive"
          grep_live_fn "processReportRequestFormSubmit"

          # A4-09 Notification Engine verification
          grep_live_fn "dispatchA409Notification"
          grep_live_fn "verifyA409NotificationEnginePrerequisites"
          grep_live_fn "testA409NotificationEngineLive"

          # A4-10 Audit Logger verification
          grep_live_fn "createA410SubmissionEntry"
          grep_live_fn "updateA410SubmissionStatus"
          grep_live_fn "logA410AutomationAction"
          grep_live_fn "getA410SubmissionById"
          grep_live_fn "verifyA410AuditLoggerPrerequisites"
          grep_live_fn "testA410AuditLoggerLive"

          # A4-14 Quota-safe behavior verification harness
          grep_live_fn "testA414QuotaSafeBehaviorLive"

          # P4-15 Zero Additional Cost live verification harness
          grep_live_fn "testP415ZeroAdditionalCostLive"


          # A4-11 Error Handler verification
          grep_live_fn "handleA411Error"
          grep_live_fn "verifyA411ErrorHandlerPrerequisites"
          grep_live_fn "testA411ErrorHandlerLive"

          # A4-00 Universal ID Generator live verification
          grep_live_fn "generateA4Id"
          grep_live_fn "reconcileA4IdCounter"
          grep_live_fn "previewA4Id"
          grep_live_fn "testA400UniversalIdClosureLive"
          grep_live_fn "testA400ConcurrentWorker"

          # Preserve the frozen Employee architecture gate.
          grep_live_fn "setupEmployeeDirectSheetWorkflow"
          grep_live_fn "onOpenEmployeeSheetMenu"
          grep_live_fn "generateSelectedEmployeeId"

          EMPLOYEE_LIVE=$(grep -RIlF "function setupEmployeeDirectSheetWorkflow" "$LIVE" --include='*.js' --include='*.gs' | head -n 1)
          test -n "$EMPLOYEE_LIVE" || { echo "FAIL: live Employee workflow source not found"; exit 1; }

          if grep -qF "function saveSelectedEmployee" "$EMPLOYEE_LIVE" ||
             grep -qF "function processSelectedEmployee" "$EMPLOYEE_LIVE" ||
             grep -qF "function showEmployeeActionsFloatingPanel" "$EMPLOYEE_LIVE" ||
             grep -qF "function processEmployeeSheetControl" "$EMPLOYEE_LIVE"; then
            echo "FAIL: obsolete Employee workflow functions are present in live source."
            exit 1
          fi

          echo "PASS: live Apps Script stabilization content verified: manifest + A4-06 + A4-07 + Employee architecture."
