name: Deploy Phase 4 Apps Script

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'Phase-4/Automation/**'
      - '.github/workflows/deploy-apps-script.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install clasp
        run: npm install --global @google/clasp

      - name: Configure clasp credentials
        env:
          CLASPRC: ${{ secrets.CLASP_CREDENTIALS }}
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          test -n "$CLASPRC" || { echo "Missing CLASPRC"; exit 1; }
          test -n "$APPS_SCRIPT_ID" || { echo "Missing APPS_SCRIPT_ID"; exit 1; }
          printf '%s' "$CLASPRC" > "$HOME/.clasprc.json"
          printf '%s\n' '{"scriptId":"'"$APPS_SCRIPT_ID"'","rootDir":"Phase-4/Automation"}' > .clasp.json

      - name: Push GitHub source to existing Apps Script project
        run: clasp push --force --non-interactive

      - name: Pull live Apps Script source for verification
        run: |
          rm -rf /tmp/live-apps-script
          mkdir -p /tmp/live-apps-script
          cp .clasp.json /tmp/live-apps-script/.clasp.json
          cp "$HOME/.clasprc.json" /tmp/live-apps-script/.clasprc.json
          cd /tmp/live-apps-script
          clasp pull --force
          echo "Retrieved files:"
          find . -type f -maxdepth 5 -print

      - name: Verify direct employee workflow is actually deployed
        run: |
          FILE="$(find /tmp/live-apps-script -type f -name 'employee_creation_workflow.gs' -print -quit)"
          test -n "$FILE" || { echo "FAIL: live employee_creation_workflow.gs was not retrieved anywhere under pulled Apps Script source"; exit 1; }
          echo "Checking live file: $FILE"
          grep -q "function setupEmployeeDirectSheetWorkflow" "$FILE" || { echo "FAIL: setupEmployeeDirectSheetWorkflow is NOT in the live Apps Script source"; exit 1; }
          grep -q "function processEmployeeSheetControl" "$FILE" || { echo "FAIL: processEmployeeSheetControl is NOT in the live Apps Script source"; exit 1; }
          if grep -q "function onOpen" "$FILE"; then echo "FAIL: obsolete onOpen remains in live Apps Script source"; exit 1; fi
          if grep -q "function showEmployeeCreationSidebar" "$FILE"; then echo "FAIL: obsolete sidebar function remains in live Apps Script source"; exit 1; fi
          echo "PASS: live Apps Script contains the direct Employees-sheet workflow and no obsolete sidebar functions."

      - name: Verify deployed source
        run: clasp status
