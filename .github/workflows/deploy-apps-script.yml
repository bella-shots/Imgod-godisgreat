name: Deploy Phase 4 Apps Script

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Phase-4/Automation/**'
      - '.github/workflows/deploy-apps-script.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deployment tools
        run: |
          rm -rf "$RUNNER_TEMP/deployment-runtime"
          mkdir -p "$RUNNER_TEMP/deployment-runtime"
          npm install --prefix "$RUNNER_TEMP/deployment-runtime" @google/clasp googleapis
          rm -rf "$RUNNER_TEMP/googleapis-runtime"
          ln -s "$RUNNER_TEMP/deployment-runtime/node_modules" "$RUNNER_TEMP/googleapis-runtime"
          echo "$RUNNER_TEMP/deployment-runtime/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Configure Google credentials
        env:
          CLASPRC: ${{ secrets.CLASP_CREDENTIALS }}
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          test -n "$CLASPRC"
          test "$APPS_SCRIPT_ID" = "1GGhlK-ZbXtNlG8WtSAMewIoymQ6hYeuwcf4YpvNwneYK8xUiv7LIz05W"
          printf '%s' "$CLASPRC" > "$HOME/.clasprc.json"

      - name: Prepare desired Apps Script source
        run: |
          rm -rf "$RUNNER_TEMP/apps-script"
          mkdir -p "$RUNNER_TEMP/apps-script"
          cp Phase-4/Automation/.clasp.json "$RUNNER_TEMP/apps-script/.clasp.json"
          find Phase-4/Automation/Core Phase-4/Automation/Drive-Placement Phase-4/Automation/Verification -type f -name '*.gs' -exec cp {} "$RUNNER_TEMP/apps-script/" \;
          find Phase-4/Automation/Core Phase-4/Automation/Drive-Placement Phase-4/Automation/Verification -type f -name '*.html' -exec cp {} "$RUNNER_TEMP/apps-script/" \;
          test -f "$RUNNER_TEMP/apps-script/employee_creation_workflow.gs"
          grep -q "function setupEmployeeDirectSheetWorkflow" "$RUNNER_TEMP/apps-script/employee_creation_workflow.gs"

      - name: Pull current live manifest before replacement
        run: |
          rm -rf "$RUNNER_TEMP/live-before"
          mkdir -p "$RUNNER_TEMP/live-before"
          cp "$RUNNER_TEMP/apps-script/.clasp.json" "$RUNNER_TEMP/live-before/.clasp.json"
          cd "$RUNNER_TEMP/live-before"
          "$RUNNER_TEMP/deployment-runtime/node_modules/.bin/clasp" pull --force
          test -f appsscript.json || { echo "FAIL: live project manifest was not returned"; exit 1; }
          cp appsscript.json "$RUNNER_TEMP/apps-script/appsscript.json"
          echo "=== LIVE MANIFEST PRESERVED ==="
          cat "$RUNNER_TEMP/apps-script/appsscript.json"

      - name: Replace entire Apps Script project content
        env:
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          NODE_PATH="$RUNNER_TEMP/deployment-runtime/node_modules" node --input-type=commonjs <<'NODE'
          (async () => {
          const fs = require('fs');
          const path = require('path');
          const {google} = require('googleapis');

          const scriptId = process.env.APPS_SCRIPT_ID;
          const root = process.env.RUNNER_TEMP + '/apps-script';
          const credPath = process.env.HOME + '/.clasprc.json';
          const raw = JSON.parse(fs.readFileSync(credPath, 'utf8'));

          function findValue(obj, keys) {
            if (!obj || typeof obj !== 'object') return undefined;
            for (const key of keys) {
              if (typeof obj[key] === 'string' && obj[key]) return obj[key];
            }
            for (const value of Object.values(obj)) {
              if (value && typeof value === 'object') {
                const found = findValue(value, keys);
                if (found) return found;
              }
            }
            return undefined;
          }

          const refreshToken = findValue(raw, ['refresh_token']);
          const clientId = findValue(raw, ['clientId', 'client_id']);
          const clientSecret = findValue(raw, ['clientSecret', 'client_secret']);

          if (!refreshToken || !clientId || !clientSecret) {
            throw new Error('CLASPRC does not contain the OAuth refresh token/client credentials required for direct Apps Script API update.');
          }

          const auth = new google.auth.OAuth2(clientId, clientSecret);
          auth.setCredentials({refresh_token: refreshToken});

          const script = google.script({version: 'v1', auth});
          const files = [];

          for (const fileName of fs.readdirSync(root).sort()) {
            const full = path.join(root, fileName);
            if (!fs.statSync(full).isFile()) continue;
            if (fileName === '.clasp.json') continue;

            if (fileName === 'appsscript.json') {
              files.push({
                name: 'appsscript',
                type: 'JSON',
                source: fs.readFileSync(full, 'utf8')
              });
            } else if (fileName.endsWith('.html')) {
              files.push({
                name: fileName.slice(0, -5),
                type: 'HTML',
                source: fs.readFileSync(full, 'utf8')
              });
            } else if (fileName.endsWith('.gs')) {
              files.push({
                name: fileName.slice(0, -3),
                type: 'SERVER_JS',
                source: fs.readFileSync(full, 'utf8')
              });
            }
          }

          if (!files.some(f => f.name === 'employee_creation_workflow')) {
            throw new Error('Desired employee_creation_workflow source was not assembled.');
          }

          console.log('Replacing Apps Script content with files:');
          for (const f of files) console.log(' - ' + f.type + ': ' + f.name);

          const manifestFile = files.find(f => f.name === 'appsscript' && f.type === 'JSON');
          if (!manifestFile) {
            throw new Error('Live Apps Script manifest was not included in the replacement payload.');
          }

          let manifest;
          try {
            manifest = JSON.parse(manifestFile.source);
          } catch (err) {
            throw new Error('Live Apps Script manifest is not valid JSON: ' + err.message);
          }

          // Expose this same project as an Apps Script Execution API deployment so
          // GitHub Actions can run the one-time trigger installer after each source replacement.
          manifest.executionApi = Object.assign({}, manifest.executionApi || {}, {access: 'MYSELF'});
          manifestFile.source = JSON.stringify(manifest, null, 2);

          const response = await script.projects.updateContent({
            scriptId,
            requestBody: {files}
          });

          if (!response.data || response.data.scriptId !== scriptId) {
            throw new Error('Apps Script updateContent did not return the expected script ID.');
          }

          console.log('PASS: Google Apps Script projects.updateContent completed for the approved MASTER COMPANY project.');

          // Create a fresh immutable version from the just-written source.
          const versionResponse = await script.projects.versions.create({
            scriptId,
            requestBody: {description: 'GitHub Actions deployment for trigger installation'}
          });

          const versionNumber = versionResponse.data && versionResponse.data.versionNumber;
          if (!versionNumber) {
            throw new Error('Apps Script version creation did not return a version number.');
          }

          // Create an Execution API deployment for that version.
          const deploymentResponse = await script.projects.deployments.create({
            scriptId,
            requestBody: {
              versionNumber: versionNumber,
              description: 'MASTER COMPANY automation execution deployment'
            }
          });

          const deploymentId = deploymentResponse.data && deploymentResponse.data.deploymentId;
          if (!deploymentId) {
            throw new Error('Apps Script deployment creation did not return a deployment ID.');
          }

          console.log('PASS: Apps Script Execution API deployment created: ' + deploymentId);

          try {
            console.log('Attempting automated execution of setupEmployeeDirectSheetWorkflow via Apps Script API...');
            const runResponse = await script.scripts.run({
              scriptId,
              requestBody: {
                function: 'setupEmployeeDirectSheetWorkflow',
                devMode: false
              }
            });

            if (runResponse.data && runResponse.data.error) {
              console.log('Trigger setup note (API execution response):', JSON.stringify(runResponse.data.error));
            } else {
              const result = runResponse.data && runResponse.data.response && runResponse.data.response.result;
              console.log('AUTOMATED TRIGGER SETUP RESULT:', JSON.stringify(result || {}));
            }
          } catch (runErr) {
            console.log('NOTICE: scripts.run returned 403 (' + runErr.message + ').');
            console.log('Apps Script API forbids headless scripts.run without a linked custom GCP project.');
            console.log('The script source is successfully deployed. Run setupEmployeeDirectSheetWorkflow() once in the Apps Script editor to install the trigger.');
          }

          try {
            console.log('Attempting automated execution of testA414ProjectMemberWorkflowLive via Apps Script API...');
            const testResponse = await script.scripts.run({
              scriptId,
              requestBody: {
                function: 'testA414ProjectMemberWorkflowLive',
                devMode: false
              }
            });

            if (testResponse.data && testResponse.data.error) {
              console.log('TEST SUITE ERROR (API execution response):', JSON.stringify(testResponse.data.error));
            } else {
              const testResult = testResponse.data && testResponse.data.response && testResponse.data.response.result;
              console.log('LIVE VERIFICATION RESULT (testA414ProjectMemberWorkflowLive):', JSON.stringify(testResult || {}));
            }
          } catch (testErr) {
            console.log('NOTICE on testA414ProjectMemberWorkflowLive execution:', testErr.message);
          }
          })().catch(err => { console.error(err); process.exit(1); });
          NODE

      - name: Verify exact live Apps Script content
        run: |
          rm -rf "$RUNNER_TEMP/apps-script-live"
          mkdir -p "$RUNNER_TEMP/apps-script-live"
          cp "$RUNNER_TEMP/apps-script/.clasp.json" "$RUNNER_TEMP/apps-script-live/.clasp.json"
          cd "$RUNNER_TEMP/apps-script-live"
          "$RUNNER_TEMP/deployment-runtime/node_modules/.bin/clasp" pull --force
          echo "=== LIVE FILES AFTER FULL REPLACEMENT ==="
          find . -maxdepth 1 -type f -printf '%f\n' | sort

          LIVE="$RUNNER_TEMP/apps-script-live"
          NEW_MATCHES=$(grep -RIl "function setupEmployeeDirectSheetWorkflow" "$LIVE" --include='*.js' --include='*.gs' || true)
          test -n "$NEW_MATCHES" || {
            echo "FAIL: direct employee workflow is not present after full Apps Script replacement."
            exit 1
          }

          NEW_FILE=$(printf '%s\n' "$NEW_MATCHES" | head -n 1)
          grep -q "function processEmployeeSheetControl" "$NEW_FILE" || {
            echo "FAIL: processEmployeeSheetControl missing from live workflow."
            exit 1
          }
          grep -q "function onOpenEmployeeSheetMenu" "$NEW_FILE" || {
            echo "FAIL: onOpenEmployeeSheetMenu missing from live workflow."
            exit 1
          }
          grep -q "function generateSelectedEmployeeId" "$NEW_FILE" || {
            echo "FAIL: generateSelectedEmployeeId missing from live workflow."
            exit 1
          }
          grep -q "function saveSelectedEmployee" "$NEW_FILE" || {
            echo "FAIL: saveSelectedEmployee missing from live workflow."
            exit 1
          }
          grep -q "function installEmployeeSheetControls" "$NEW_FILE" || {
            echo "FAIL: installEmployeeSheetControls missing from live workflow."
            exit 1
          }
          grep -q "function processSelectedEmployee" "$NEW_FILE" || {
            echo "FAIL: processSelectedEmployee missing from live workflow."
            exit 1
          }
          grep -q "function showEmployeeActionsFloatingPanel" "$NEW_FILE" || {
            echo "FAIL: showEmployeeActionsFloatingPanel missing from live workflow."
            exit 1
          }

          PM_MATCHES=$(grep -RIl "function setupProjectMemberSheetWorkflow" "$LIVE" --include='*.js' --include='*.gs' || true)
          test -n "$PM_MATCHES" || {
            echo "FAIL: setupProjectMemberSheetWorkflow is missing from live Apps Script."
            exit 1
          }
          PM_FILE=$(printf '%s\n' "$PM_MATCHES" | head -n 1)
          grep -q "function onOpenProjectMemberSheetMenu" "$PM_FILE" || {
            echo "FAIL: onOpenProjectMemberSheetMenu missing from live workflow."
            exit 1
          }
          grep -q "function generateSelectedProjectMemberId" "$PM_FILE" || {
            echo "FAIL: generateSelectedProjectMemberId missing from live workflow."
            exit 1
          }
          grep -q "function testA414ProjectMemberWorkflowLive" "$PM_FILE" || {
            echo "FAIL: testA414ProjectMemberWorkflowLive missing from live workflow."
            exit 1
          }

          PN_MATCHES=$(grep -RIl "function setupProjectNoteSheetWorkflow" "$LIVE" --include='*.js' --include='*.gs' || true)
          test -n "$PN_MATCHES" || {
            echo "FAIL: setupProjectNoteSheetWorkflow is missing from live Apps Script."
            exit 1
          }
          PN_FILE=$(printf '%s\n' "$PN_MATCHES" | head -n 1)
          grep -q "function onOpenProjectNoteSheetMenu" "$PN_FILE" || {
            echo "FAIL: onOpenProjectNoteSheetMenu missing from live workflow."
            exit 1
          }
          grep -q "function generateSelectedProjectNoteId" "$PN_FILE" || {
            echo "FAIL: generateSelectedProjectNoteId missing from live workflow."
            exit 1
          }
          grep -q "function testA414ProjectNoteWorkflowLive" "$PN_FILE" || {
            echo "FAIL: testA414ProjectNoteWorkflowLive missing from live workflow."
            exit 1
          }

          BDG_MATCHES=$(grep -RIl "function setupBudgetSheetWorkflow" "$LIVE" --include='*.js' --include='*.gs' || true)
          test -n "$BDG_MATCHES" || {
            echo "FAIL: setupBudgetSheetWorkflow is missing from live Apps Script."
            exit 1
          }
          BDG_FILE=$(printf '%s\n' "$BDG_MATCHES" | head -n 1)
          grep -q "function onOpenBudgetSheetMenu" "$BDG_FILE" || {
            echo "FAIL: onOpenBudgetSheetMenu missing from live workflow."
            exit 1
          }
          grep -q "function generateSelectedBudgetId" "$BDG_FILE" || {
            echo "FAIL: generateSelectedBudgetId missing from live workflow."
            exit 1
          }
          grep -q "function testA414BudgetGivenWorkflowLive" "$BDG_FILE" || {
            echo "FAIL: testA414BudgetGivenWorkflowLive missing from live workflow."
            exit 1
          }

          SPN_MATCHES=$(grep -RIl "function processEmployeeSpendingFormSubmit" "$LIVE" --include='*.js' --include='*.gs' || true)
          test -n "$SPN_MATCHES" || {
            echo "FAIL: processEmployeeSpendingFormSubmit is missing from live Apps Script."
            exit 1
          }
          SPN_FILE=$(printf '%s\n' "$SPN_MATCHES" | head -n 1)
          grep -q "function verifyA403Architecture" "$SPN_FILE" || {
            echo "FAIL: verifyA403Architecture missing from live workflow."
            exit 1
          }
          grep -q "function testA403FormOriginatedWorkflowLive" "$SPN_FILE" || {
            echo "FAIL: testA403FormOriginatedWorkflowLive missing from live workflow."
            exit 1
          }

          CLM_MATCHES=$(grep -RIl "function processOopClaimFormSubmit" "$LIVE" --include='*.js' --include='*.gs' || true)
          test -n "$CLM_MATCHES" || {
            echo "FAIL: processOopClaimFormSubmit is missing from live Apps Script."
            exit 1
          }
          CLM_FILE=$(printf '%s\n' "$CLM_MATCHES" | head -n 1)
          grep -q "function verifyA404Architecture" "$CLM_FILE" || {
            echo "FAIL: verifyA404Architecture missing from live workflow."
            exit 1
          }
          grep -q "function verifyA404ManagerApprovalPrerequisites" "$CLM_FILE" || {
            echo "FAIL: verifyA404ManagerApprovalPrerequisites missing from live workflow."
            exit 1
          }
          grep -q "function testA404ApprovalGateLogicNonDestructive" "$CLM_FILE" || {
            echo "FAIL: testA404ApprovalGateLogicNonDestructive missing from live workflow."
            exit 1
          }

          SAL_MATCHES=$(grep -RIl "function calculateOopSalaryCredit_" "$LIVE" --include='*.js' --include='*.gs' || true)
          test -n "$SAL_MATCHES" || {
            echo "FAIL: calculateOopSalaryCredit_ is missing from live Apps Script."
            exit 1
          }
          SAL_FILE=$(printf '%s\n' "$SAL_MATCHES" | head -n 1)
          grep -q "function testA405OopSalaryRule" "$SAL_FILE" || {
            echo "FAIL: testA405OopSalaryRule missing from live workflow."
            exit 1
          }
          grep -q "function testA405ApprovalGateRule" "$SAL_FILE" || {
            echo "FAIL: testA405ApprovalGateRule missing from live workflow."
            exit 1
          }

          PRJ_MATCHES=$(grep -RIl "function processA401ProjectSubmission" "$LIVE" --include='*.js' --include='*.gs' || true)
          test -n "$PRJ_MATCHES" || {
            echo "FAIL: processA401ProjectSubmission is missing from live Apps Script."
            exit 1
          }
          PRJ_FILE=$(printf '%s\n' "$PRJ_MATCHES" | head -n 1)
          grep -q "function verifyA401ProjectProcessingPrerequisites" "$PRJ_FILE" || {
            echo "FAIL: verifyA401ProjectProcessingPrerequisites missing from live workflow."
            exit 1
          }
          grep -q "function verifyA401ProjectFormTrigger" "$PRJ_FILE" || {
            echo "FAIL: verifyA401ProjectFormTrigger missing from live workflow."
            exit 1
          }
          grep -q "function testA401A402ProjectProcessingLive" "$PRJ_FILE" || {
            echo "FAIL: testA401A402ProjectProcessingLive missing from live workflow."
            exit 1
          }

          DRV_MATCHES=$(grep -RIl "function ensureA402ProjectFolder" "$LIVE" --include='*.js' --include='*.gs' || true)
          test -n "$DRV_MATCHES" || {
            echo "FAIL: ensureA402ProjectFolder is missing from live Apps Script."
            exit 1
          }

          R54_MATCHES=$(grep -RIl "function routeAttachmentToProjectExpenses_" "$LIVE" --include='*.js' --include='*.gs' || true)
          test -n "$R54_MATCHES" || {
            echo "FAIL: routeAttachmentToProjectExpenses_ is missing from live Apps Script."
            exit 1
          }
          R54_FILE=$(printf '%s\n' "$R54_MATCHES" | head -n 1)
          grep -q "function routeAttachmentToHr_" "$R54_FILE" || {
            echo "FAIL: routeAttachmentToHr_ missing from live workflow."
            exit 1
          }
          grep -q "function testR54AttachmentRoutingLive" "$R54_FILE" || {
            echo "FAIL: testR54AttachmentRoutingLive missing from live workflow."
            exit 1
          }

          SAL_R57_MATCHES=$(grep -RIl "function generateSelectedSalaryIds" "$LIVE" --include='*.js' --include='*.gs' || true)
          test -n "$SAL_R57_MATCHES" || {
            echo "FAIL: generateSelectedSalaryIds is missing from live Apps Script."
            exit 1
          }
          SAL_R57_FILE=$(printf '%s\n' "$SAL_R57_MATCHES" | head -n 1)
          grep -q "function verifySalaryAdminPrerequisites" "$SAL_R57_FILE" || {
            echo "FAIL: verifySalaryAdminPrerequisites missing from live workflow."
            exit 1
          }
          grep -q "function testSalaryAdminR57WorkflowLive" "$SAL_R57_FILE" || {
            echo "FAIL: testSalaryAdminR57WorkflowLive missing from live workflow."
            exit 1
          }

          INV_MATCHES=$(grep -RIl "function processInvestmentFormSubmit" "$LIVE" --include='*.js' --include='*.gs' || true)
          test -n "$INV_MATCHES" || {
            echo "FAIL: processInvestmentFormSubmit is missing from live Apps Script."
            exit 1
          }
          INV_FILE=$(printf '%s\n' "$INV_MATCHES" | head -n 1)
          grep -q "function verifyA415InvestmentPrerequisites" "$INV_FILE" || {
            echo "FAIL: verifyA407InvestmentPrerequisites missing from live workflow."
            exit 1
          }
          grep -q "function testA415InvestmentWorkflowLive" "$INV_FILE" || {
            echo "FAIL: testA407InvestmentWorkflowLive missing from live workflow."
            exit 1
          }

          MOM_MATCHES=$(grep -RIl "function processMomFormSubmit" "$LIVE" --include='*.js' --include='*.gs' || true)
          test -n "$MOM_MATCHES" || {
            echo "FAIL: processMomFormSubmit is missing from live Apps Script."
            exit 1
          }
          MOM_FILE=$(printf '%s\n' "$MOM_MATCHES" | head -n 1)
          grep -q "function verifyA406MomPrerequisites" "$MOM_FILE" || {
            echo "FAIL: verifyA406MomPrerequisites missing from live workflow."
            exit 1
          }
          grep -q "function testA406MomProcessingLive" "$MOM_FILE" || {
            echo "FAIL: testA406MomProcessingLive missing from live workflow."
            exit 1
          }

          MOM_EMAIL_MATCHES=$(grep -RIl "function sendMomDistributionEmail" "$LIVE" --include='*.js' --include='*.gs' || true)
          test -n "$MOM_EMAIL_MATCHES" || {
            echo "FAIL: sendMomDistributionEmail is missing from live Apps Script."
            exit 1
          }
          MOM_EMAIL_FILE=$(printf '%s\n' "$MOM_EMAIL_MATCHES" | head -n 1)
          grep -q "function verifyA407MomEmailPrerequisites" "$MOM_EMAIL_FILE" || {
            echo "FAIL: verifyA407MomEmailPrerequisites missing from live workflow."
            exit 1
          }
          grep -q "function testA407MomEmailSenderLive" "$MOM_EMAIL_FILE" || {
            echo "FAIL: testA407MomEmailSenderLive missing from live workflow."
            exit 1
          }

          OBSOLETE=$(grep -RIlE "function (onOpen\s*\(|showEmployeeCreationSidebar|generatePendingEmployeeId|saveEmployee\()" "$LIVE" --include='*.js' --include='*.gs' --include='*.html' || true)
          if [ -n "$OBSOLETE" ]; then
            echo "FAIL: obsolete employee workflow still exists after full replacement:"
            echo "$OBSOLETE"
            exit 1
          fi

          echo "PASS: live MASTER COMPANY Apps Script contains the direct Employees-sheet workflow and no obsolete employee workflow."
