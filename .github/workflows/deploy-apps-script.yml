name: Deploy Phase 4 Apps Script

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Phase-4/Automation/**'
      - '.github/workflows/deploy-apps-script.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install clasp
        run: npm install --global @google/clasp

      - name: Configure clasp
        env:
          CLASPRC: ${{ secrets.CLASP_CREDENTIALS }}
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
        run: |
          test -n "$CLASPRC"
          test "$APPS_SCRIPT_ID" = "1GGhlK-ZbXtNlG8WtSAMewIoymQ6hYeuwcf4YpvNwneYK8xUiv7LIz05W"
          printf '%s' "$CLASPRC" > "$HOME/.clasprc.json"

      - name: Prepare exact Apps Script source
        run: |
          rm -rf "$RUNNER_TEMP/apps-script"
          mkdir -p "$RUNNER_TEMP/apps-script"
          cp Phase-4/Automation/.clasp.json "$RUNNER_TEMP/apps-script/.clasp.json"
          find Phase-4/Automation/Core Phase-4/Automation/Drive-Placement Phase-4/Automation/Verification -type f -name '*.gs' -exec cp {} "$RUNNER_TEMP/apps-script/" \;
          find Phase-4/Automation/Core Phase-4/Automation/Drive-Placement Phase-4/Automation/Verification -type f -name '*.html' -exec cp {} "$RUNNER_TEMP/apps-script/" \;
          test -f "$RUNNER_TEMP/apps-script/employee_creation_workflow.gs"
          grep -q "function setupEmployeeDirectSheetWorkflow" "$RUNNER_TEMP/apps-script/employee_creation_workflow.gs"

      - name: Push to existing MASTER COMPANY Apps Script
        run: |
          cd "$RUNNER_TEMP/apps-script"
          clasp push --force --non-interactive
          clasp status --json

      - name: Pull live Apps Script source
        run: |
          rm -rf "$RUNNER_TEMP/apps-script-live"
          mkdir -p "$RUNNER_TEMP/apps-script-live"
          cp "$RUNNER_TEMP/apps-script/.clasp.json" "$RUNNER_TEMP/apps-script-live/.clasp.json"
          cd "$RUNNER_TEMP/apps-script-live"
          clasp pull --force
          find . -maxdepth 1 -type f -print | sort

      - name: Verify live direct employee workflow
        run: |
          FILE="$RUNNER_TEMP/apps-script-live/employee_creation_workflow.gs"
          test -f "$FILE" || { echo "FAIL: live employee_creation_workflow.gs missing"; exit 1; }
          grep -q "function setupEmployeeDirectSheetWorkflow" "$FILE" || { echo "FAIL: setupEmployeeDirectSheetWorkflow missing"; exit 1; }
          grep -q "function processEmployeeSheetControl" "$FILE" || { echo "FAIL: processEmployeeSheetControl missing"; exit 1; }
          ! grep -q "function onOpen" "$FILE" || { echo "FAIL: obsolete onOpen remains"; exit 1; }
          ! grep -q "function showEmployeeCreationSidebar" "$FILE" || { echo "FAIL: obsolete sidebar remains"; exit 1; }
          ! grep -q "function generatePendingEmployeeId" "$FILE" || { echo "FAIL: obsolete generatePendingEmployeeId remains"; exit 1; }
          ! grep -q "function saveEmployee(" "$FILE" || { echo "FAIL: obsolete saveEmployee remains"; exit 1; }
          echo "PASS: live MASTER COMPANY Apps Script is the direct Employees-sheet workflow."
