<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body{font-family:Arial,sans-serif;padding:12px}
    label{display:block;font-weight:600;margin-top:10px}
    input,select,textarea{box-sizing:border-box;width:100%;padding:7px;margin-top:4px}
    button{width:100%;padding:9px;margin-top:12px;cursor:pointer}
    .status{margin-top:12px;padding:8px;white-space:pre-wrap}
    .error{color:#b00020}
    .success{color:#0b6b2a}
    #employeeId{font-weight:700;background:#f3f3f3}
  </style>
</head>
<body>
  <h3>Employee Entry</h3>

  <label>Name *</label><input id="name">
  <label>Email *</label><input id="email" type="email">
  <label>Role *</label><input id="role">
  <label>Designation *</label><input id="designation">
  <label>Salary Basis (6-month CTC/stipend)</label><input id="salaryBasis" type="number" min="0">
  <label>Payment Frequency *</label>
  <select id="paymentFrequency"><option value="Monthly">Monthly</option><option value="One-Time">One-Time</option></select>
  <label>Active *</label>
  <select id="active"><option value="true">TRUE</option><option value="false">FALSE</option></select>
  <label>Reimbursement Eligible *</label>
  <select id="reimbursementEligible"><option value="true">TRUE</option><option value="false">FALSE</option></select>
  <label>Project Access</label><input id="projectAccess">
  <label>Joining Date *</label><input id="joiningDate" type="date">
  <label>Employment Status *</label>
  <select id="employmentStatus">
    <option>Probation</option><option>Full-Time</option><option>Notice Period</option><option>Relieved</option>
  </select>
  <label>HR Notes</label><textarea id="hrNotes"></textarea>
  <label>Reimbursement Settings *</label>
  <select id="reimbursementSettings">
    <option>Standard</option><option>Executive</option><option>Contractor-Direct</option>
  </select>

  <label>Employee ID</label><input id="employeeId" readonly>

  <button onclick="generateId()">GENERATE EMPLOYEE ID</button>
  <button id="saveButton" onclick="saveEmployee()" disabled>SAVE EMPLOYEE</button>
  <div id="status" class="status"></div>

<script>
function data(){
  return {
    name:v('name'),email:v('email'),role:v('role'),designation:v('designation'),
    salaryBasis:v('salaryBasis'),paymentFrequency:v('paymentFrequency'),
    active:v('active'),reimbursementEligible:v('reimbursementEligible'),
    projectAccess:v('projectAccess'),joiningDate:v('joiningDate'),
    employmentStatus:v('employmentStatus'),hrNotes:v('hrNotes'),
    reimbursementSettings:v('reimbursementSettings'),employeeId:v('employeeId')
  };
}
function v(id){return document.getElementById(id).value;}
function setStatus(msg,ok){
  const el=document.getElementById('status');el.textContent=msg;
  el.className='status '+(ok?'success':'error');
}
function generateId(){
  setStatus('Validating...',true);
  google.script.run.withSuccessHandler(function(r){
    document.getElementById('employeeId').value=r.employeeId;
    document.getElementById('saveButton').disabled=false;
    setStatus(r.message,true);
  }).withFailureHandler(function(e){setStatus(e.message||String(e),false);})
    .generatePendingEmployeeId(data());
}
function saveEmployee(){
  document.getElementById('saveButton').disabled=true;
  setStatus('Saving...',true);
  google.script.run.withSuccessHandler(function(r){
    setStatus(r.message+' '+r.employeeId,true);
    document.querySelectorAll('input,select,textarea,button').forEach(function(x){x.disabled=true;});
  }).withFailureHandler(function(e){
    document.getElementById('saveButton').disabled=false;
    setStatus(e.message||String(e),false);
  }).saveEmployee(data());
}
</script>
</body>
</html>
